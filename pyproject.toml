[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "cedarkit-maps"
authors = [
    {name="Wang Dapeng", email="perillaroc@gmail.com"}
]
description = "A graph tool for CEMC/CMA."
readme = "README.md"
keywords = ["graphic", "cemc", "cedarkit"]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "cartopy>=0.23.0",
    "xarray",
]

[project.urls]
Homepage = "https://github.com/cemc-oper/cedarkit-maps"
Repository = "https://github.com/cemc-oper/cedarkit-maps.git"

[project.optional-dependencies]
test = ["pytest", "scipy"]
cov = ["pytest-cov"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cedarkit.maps", "cedarkit.maps.*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools_scm]
version_file = "cedarkit/maps/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
