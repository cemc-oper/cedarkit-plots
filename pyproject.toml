[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "cedarkit-plots"
authors = [
    {name="Wang Dapeng", email="perillaroc@gmail.com"}
]
description = "A graph tool for CEMC/CMA."
readme = "README.md"
keywords = ["graphic", "cemc", "cedarkit"]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "cartopy>=0.23.0",
    "xarray",
    "pydantic>=2",
    "PyYAML",
    "reki>=2026.8.0",
    "cedarkit-comp>=2025.7.0",
]

[project.urls]
Homepage = "https://github.com/cemc-oper/cedarkit-plots"
Repository = "https://github.com/cemc-oper/cedarkit-plots.git"

[project.scripts]
cedarkit-plots = "cedarkit.plots.cli:main"

[project.optional-dependencies]
test = ["pytest", "scipy"]
cov = ["pytest-cov"]
docs = [
    "sphinx>=7.3",
    "sphinx-book-theme>=1.1",
    "myst-nb>=1.1",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
    "linkify-it-py>=2.0",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cedarkit.plots", "cedarkit.plots.*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools_scm]
version_file = "cedarkit/plots/_version.py"

[tool.uv.sources]
cedarkit-comp = { path = "../cedarkit-comp", editable = true }
reki = { path = "../reki", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
